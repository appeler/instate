name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4   # ⬅️ newer version of the action
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip + install dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip uninstall -y numpy tensorflow keras || true
          pip install "numpy<2.0"
          pip install "tensorflow<2.15"
          pip install --no-cache-dir ".[test]"

      - name: Run tests with pytest
        run: pytest

      - name: Show TensorFlow and NumPy versions
        run: |
          python -c "import tensorflow as tf, numpy as np; print('TF:', tf.__version__, '| NumPy:', np.__version__)"
