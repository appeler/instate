name: Find Adjacent Repositories

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: adjacent-repositories-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recommend-repos:
    name: Update adjacent repositories
    permissions:
      contents: write # commit the generated README update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adjacent Repositories Recommender
        uses: gojiplus/adjacent@ab14392f3ccd0179ee0f8a995748b3b5485b6e36 # v1.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add README.md
          git commit -m "Update adjacent repositories"
          git push
