[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "instate"
version = "3.0.0"
description = "Calibrated state and language composition estimates for Indian surnames"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Atul Dhingra", email = "dhingra.atul92@gmail.com" },
  { name = "Gaurav Sood", email = "gsood07@gmail.com" },
  { name = "Rajashekar Chintalapati", email = "rajshekar.ch@gmail.com" }
]

keywords = ["surname", "electoral rolls", "state composition", "language composition", "census"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities"
]

dependencies = [
  "pandas>=1.5.0",
  "pyarrow>=14.0.0",
  "numpy>=1.21.0,<3.0.0",
  "torch>=2.0.0",
  "huggingface-hub>=1.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pre-commit>=4",
    "deptry>=0.24",
    "pandas-stubs>=2.0",
    { include-group = "test" },
]
test = [
    "click>=8",
    "duckdb>=1.5.3",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.0",
    "tqdm>=4.60",
]
docs = [
    "sphinx>=8",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]

[project.urls]
"Homepage" = "https://github.com/appeler/instate"
"Repository" = "https://github.com/appeler/instate"
"Bug Tracker" = "https://github.com/appeler/instate/issues"

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "docs",
    ".eggs",
    "model_training",
    "ms",
    "*.ipynb",
]

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["instate"]

# Black configuration

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "model_training/prep_er_data"]
python_files = "test_*.py"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=instate",
    "-m",
    "not live",
    # term-missing only: nothing in CI uploads or reads a coverage file, so
    # html and xml were writing htmlcov/ and coverage.xml into the tree on
    # every run -- local ones included -- for no reader. py-canon's reusable CI
    # puts the table in the GitHub job summary instead.
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live: checks remote services and is deselected by default",
]


# Coverage configuration
[tool.coverage.run]
source = ["instate"]
branch = true

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Deptry configuration
[tool.deptry]
ignore_notebooks = true
extend_exclude = [
    "model_training",  # Excluded from package build
    ".ipynb_checkpoints",  # Jupyter checkpoint files
    "ms",  # Manuscript directory excluded from package build
]

[tool.deptry.per_rule_ignores]
DEP001 = ["StringIO"]
DEP002 = ["numpy", "pyarrow", "sphinx", "furo", "myst-parser", "sphinx-copybutton"]
DEP003 = ["instate"]
DEP004 = ["py_canon"]

# Pydoclint configuration
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'
check-arg-order = false
require-return-section-when-returning-nothing = false
skip-checking-short-docstrings = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.uv.build-backend]
source-exclude = [".DS_Store"]
